<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            width: 300px;
            height: 400px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 10px rgb(0, 0, 0);
            transition: transform 0.3s ease;
            margin: 20px;
        }

        .card:hover{
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgb(193, 106, 243);
        }

        .card img{
            width: 100%;
            height: auto;
        }
        .card-content{
            padding: 20px;
        }
        .card-content h2{
            text-align: center;
            font-size: 24px;
            margin: 0;
            color: #c92f2f;
            
        }
        .card-button{
            background-color: #c92f2f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-family: Arial, Helvetica, sans-serif;
            
        }
        .card-button:hover{
            background-color: #df2424;
            scale: 1.05;
            transition: scale 0.3s ease;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://static.vecteezy.com/system/resources/thumbnails/036/324/708/small/ai-generated-picture-of-a-tiger-walking-in-the-forest-photo.jpg" alt="sample image">
        <div class="card-content">
            <h2>Card Title</h2>
            <p>This is simple description inside the card.</p>
            <button class="card-button">Learn More</button>
        </div>
    </div>
</body>
</html>
