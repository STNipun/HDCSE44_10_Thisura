<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .BT01, .BT02{
            background-color: #c92f2f;
            color: white;
            border: solid;
            padding: 10px 20px;
            border-style: none;
            border-width: 1px;
            border-radius: 5px;
        }
        .BT01:hover, .BT02:hover{
            background-color: #df2424;
            scale: 1.05;
            transition: scale 0.3s ease;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            border-style: none;
            border-radius: 5px;
        }
        /* Use of defferent Font style */
        .cookie-regular {
            font-family: "Cookie", cursive;
            font-weight: 400;
            font-style: normal;
        }

    </style>
</head>
<body>
    <!-- This is also use of defferent font style -->
     <!-- CSS and HTML bith files should connect -->
    <button class="BT01 cookie-regular">Click me 01</button>
    <br>
    <br>
    <button class="BT02">Click me 02</button>
    <br>
    <br>
    <button class="BT03">Click me 03</button>
    <br>
    <br>
    <button class="BT04">Click me 04</button>
    <br>
</body>
</html>
